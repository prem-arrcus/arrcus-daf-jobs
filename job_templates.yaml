# Templates for the jobs in the arrcus-daf-jobs project.
#
# Everything that is common to every job lives here. Per-job specific
# information (name, daf branch, report recipient, script overrides, etc.)
# comes from jobs.yaml. Placeholders of the form {placeholder_name} are
# filled in by generate_job_definitions.py when it generates
# jenkins-job-definitions.generated.yaml.
#
# daf_test_job (one job per jobs.yaml entry) - known placeholders:
#   {name}          - job name                             (from jobs.yaml)
#   {daf_branch}    - git branch of the arrcus-daf repo    (from jobs.yaml)
#   {yang_branch}   - yang models branch (--yang-branch)   (from jobs.yaml)
#   {report_email}  - recipient of the email report        (from jobs.yaml)
#   {script}        - test script to run (optional)        (from jobs.yaml)
#   {post_script}   - post-processing script (optional)    (from jobs.yaml)
#   {auth_token}    - remote trigger token (default: name) (from jobs.yaml)
#   {extra_args}    - default pytest extra arguments       (from jobs.yaml)
#   {topo_file}     - default topology file                (from jobs.yaml)
#   {vpp}           - default of the vpp build parameter   (from jobs.yaml)
#   {label}         - node label expression (default: daf) (from jobs.yaml)
#   {git_mirrors}   - <name>=<url> pairs of the repos in the scm: section
#   {daf_mirror_name} - mirror name of the FIRST repo in the scm: section
#                     (the repo that is checked out into ${daf_repo_dir})
#
# daf_pipeline_job (emitted once) - known placeholders:
#   {daf_jobs}      - groovy list literal of all job names (from jobs.yaml)
#   {report_email}  - default recipients for the consolidated report
#                     (report_email of the FIRST job in jobs.yaml)
#
# IMPORTANT - parameter names must use underscores, never dashes:
# In the shell builders the build parameters are referenced as
# ${daf_branch} etc. bash would interpret a dash form like
# ${daf-branch} as "variable ${daf} with the default value 'branch'"
# (${parameter-word} expansion), NOT as the Jenkins parameter named
# daf-branch. Underscore names keep the shell references unambiguous.

# Directory on the executor nodes that holds the bare repository
# mirrors. The generator substitutes it for {git_mirror_dir} in the job
# template (both the pre-SCM mirror step and the scm: checkout url), so
# the two always agree.
#
# It MUST be writable by the user the build runs as (the ssh user of the
# agent node, not root): the pre-SCM step creates the mirrors there and
# the checkout reads them back. /var/cache/jenkins is the node's remoteFS
# (JENKINS_HOME workspace root), so it is already owned by that user.
git_mirror_dir: /var/cache/jenkins/git

# Upstream git repositories mirrored by the jobs.
#
# Every job's pre-SCM build step creates {git_mirror_dir} if needed and
# then, for each repository listed here, either clones it as a bare
# mirror (git clone --mirror <url> <mirror dir>/<name>.git) or updates
# the existing mirror (git --git-dir=<mirror dir>/<name>.git remote
# update --prune). The job's scm: section then checks the FIRST
# repository listed here out of its mirror.
#
# Fields:
#   url            - (required) upstream repository url
#   name           - mirror directory name under {git_mirror_dir}
#                    (default: url basename without .git); the first
#                    repository's name is used in the scm: url, so it
#                    must match the checkout repository
#   credentials_id - ssh credential id used to reach the repository
#                    (loaded into the build's ssh-agent so the pre-SCM
#                    mirror step can authenticate)
git_repos:
  - url: git@github.com:prem-arrcus/arrcus-daf.git
    name: arrcus-daf
    credentials_id: github-daf-ssh-key

daf_test_job:
  name: "{name}"
  description: |
    Arrcus DAF test job '{name}'.

    Generated by generate_job_definitions.py - do not edit by hand.
    Edit jobs.yaml / job_templates.yaml instead and re-run manage_jobs.sh.

  # Allow the job to be triggered remotely, e.g.:
  #   curl -X POST "https://<jenkins>/job/{name}/buildWithParameters?token={auth_token}&image=<image name>"
  # (the {auth_token} placeholder defaults to the job name; override it
  # with an auth_token field in jobs.yaml for something more secret)
  auth-token: "{auth_token}"

  logrotate:
    numToKeep: 30

  parameters:
    # The image parameter is deliberately the first parameter of every
    # job so that it is the most prominent field on the default
    # parameter order text.
    - validating-string:
        name: image
        default: ""
        regex: ".+"
        msg: "image parameter is mandatory"
        description: >
          Image name to run the tests against. Must be given when the
          job is built (overridden by the DAF Pipeline with its own
          image when it triggers the job). Exported to the test script
          as the DAF_IMAGE environment variable.
    - string:
        name: extra_args
        default: "{extra_args}"
        description: >
          Extra arguments to append to the pytest command line (e.g.
          "-k smoke -x"). Defaults to the extra_args configured for
          this job in jobs.yaml, if any; when triggered by the DAF
          Pipeline, inherits the pipeline's extra_args.
    - string:
        name: topo_file
        default: "{topo_file}"
        description: >
          Topology file given to pytest as --topo-file. Defaults to the
          topo_file configured for this job in jobs.yaml, or
          daf/tests/<script>/topo.yaml if neither is specified; when
          triggered by the DAF Pipeline, a non-empty pipeline topo_file
          overrides this one.
    - bool:
        name: vpp
        default: "{vpp}"
        description: >
          When checked, adds --vpp to the pytest command line. Defaults
          to the vpp setting configured for this job in jobs.yaml
          (false if not set); when triggered by the DAF Pipeline with
          its vpp parameter enabled, this job inherits it.
    - bool:
        name: debug_console
        default: false
        description: >
          When checked, adds --debug-console to the pytest command line.
          Not configurable via jobs.yaml.
    - bool:
        name: reconnect
        default: false
        description: >
          When checked, adds --reconnect to the pytest command line.
          Not configurable via jobs.yaml.
    - string:
        name: install_pkgs
        default: ""
        description: >
          Packages to install, passed to pytest as --install-pkgs. Not
          configurable via jobs.yaml; when empty, no --install-pkgs
          argument is added.
    - bool:
        name: pause_on_fail
        default: false
        description: >
          When checked and pytest fails, the build pauses before the
          cleanup (daf destroy) step so the testbed can be inspected.
          Resume it by creating the file named in the console output
          (touch <mirror dir>/.pause/<BUILD_TAG>.resume); after 3
          hours it continues by itself. Not configurable via jobs.yaml.
    - string:
        name: tb_name
        default: ""
        description: >
          Testbed name given to pytest as --tb-name. If left empty,
          defaults to TB<BUILD_NUMBER> (e.g. TB123). Not configurable
          via jobs.yaml.
    - string:
        name: daf_repo_dir
        default: arrcus-daf
        description: >
          Directory (relative to the Jenkins workspace) into which the
          arrcus-daf repository is checked out.
    - string:
        name: daf_branch
        default: "{daf_branch}"
        description: >
          Git branch of the arrcus-daf repository to check out before
          running the tests.
    - string:
        name: yang_branch
        default: "{yang_branch}"
        description: >
          Yang models branch, passed to pytest as --yang-branch. Defaults
          to the yang_branch configured for this job in jobs.yaml; when
          empty, no --yang-branch argument is added and pytest/daf uses
          its own default.
    - string:
        name: script
        default: "{script}"
        description: >
          Pytest script to run. If left empty, defaults to
          daf/tests/{name}/run_tests.py inside the daf repo.
    - string:
        name: label
        default: "{label}"
        description: >
          Node label expression that restricts where this job can run.
          The job will only be assigned to a node whose labels match
          this expression. Defaults to the label configured for this
          job in jobs.yaml (daf if not set).
  # Node constraint: set per-job from jobs.yaml ({label} placeholder).
  # Restricts the job to nodes whose labels match this expression.
  # Defaults to "daf" when not specified in jobs.yaml.
  node: "{label}"

  # Upstream git repositories are declared once, at the top of this
  # file (git_repos: section); the pre-SCM build step below mirrors
  # them and the scm: section checks the repository out of the mirror.

  # Repositories used by the job. This is Jenkins' own SCM checkout: it
  # checks the repository out of the local mirror that the pre-SCM build
  # step below created / updated, so no network access is needed here.
  #
  # Notes:
  # - the url MUST use the file:// form: with a plain local path git
  #   silently ignores --depth and the clone is not shallow
  #   ("warning: --depth is ignored in local clones; use file:// instead")
  # - ${daf_branch} and ${daf_repo_dir} are build parameters; the git
  #   plugin expands them (the branch specifier and the "check out to a
  #   sub-directory" extension both support variable expansion)
  # - wipe-workspace must stay false: the checkout directory also holds
  #   the .env symlink to the shared virtual env ({daf_venv_dir}), and
  #   the pre-SCM step clones the branch into this directory before
  #   install.sh runs there
  scm:
    - git:
        url: "file://{git_mirror_dir}/{daf_mirror_name}.git"
        branches:
          - "${daf_branch}"
        basedir: "${daf_repo_dir}"
        wipe-workspace: true
        shallow-clone: true
        depth: 1
        submodule:
          disable: false
          parent-credentials: true
        do-not-fetch-tags: true
        timeout: 30

  wrappers:
    # SSH Agent plugin: starts an ssh-agent for the build and loads the
    # ssh credentials declared for the upstream repositories in the
    # git_repos: section.
    #
    # THIS WRAPPER MUST STAY FIRST, BEFORE pre-scm-buildstep: the agent
    # is started in the wrapper's preCheckout(), which runs before the
    # pre-SCM steps, and the SSHAgentEnvironment it registers puts
    # SSH_AUTH_SOCK in the environment those steps see, so the mirror
    # clone / update can authenticate against GitHub. Reordering it
    # after pre-scm-buildstep leaves SSH_AUTH_SOCK unset there.
    #
    # (The credentials-binding wrapper cannot be used for this: it
    # creates its variables in setUp(), which runs after preCheckout -
    # i.e. after the pre-SCM steps have already failed to authenticate.)
    #
    # generate_job_definitions.py fills users in from the credentials_id
    # declared for the repositories; the value below is only a
    # fallback/documentation.
    - ssh-agent-credentials:
        users:
          - github-daf-ssh-key

    # Pre-SCM build step: create {git_mirror_dir} (if needed) and create
    # or update a bare mirror of every repository in the git_repos:
    # section above:
    #   - mirror missing -> git clone --mirror <repo url> <mirror dir>/<repo name>.git
    #   - mirror exists  -> git --git-dir=<mirror dir>/<repo name>.git remote update --prune
    # The checkout itself is done afterwards by the scm: section above,
    # from those mirrors.
    # Requires the "Pre SCM BuildStep" plug-in (preSCMbuildstep); the
    # authentication comes from the ssh-agent started by the wrapper
    # above.
    - pre-scm-buildstep:
        failOnError: true
        buildsteps:
          - shell: |
              set -ex
              GIT_CACHE={git_mirror_dir}
              mkdir -p "${GIT_CACHE}"

              # Authenticate against GitHub through the ssh-agent started
              # by the ssh-agent-credentials wrapper above (SSH_AUTH_SOCK
              # is part of this step's environment). Accept github.com's
              # host key on first use, so no known_hosts entry is needed.
              GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=accept-new"
              export GIT_SSH_COMMAND

              # Repositories from the git_repos: section, as
              # <mirror name>=<repo url> pairs. Generated by
              # generate_job_definitions.py.
              REPOS="{git_mirrors}"
              for entry in ${REPOS}; do
                name="${entry%%=*}"
                url="${entry#*=}"
                mirror="${GIT_CACHE}/${name}.git"
                if [ ! -d "${mirror}" ]; then
                  git clone --mirror "${url}" "${mirror}"
                else
                  git --git-dir="${mirror}" remote update --prune
                fi
              done

              # The virtual env is created by install.sh from the checked
              # out sources and then moved next to the mirror
              # ({daf_venv_dir}), so it is shared by all jobs and
              # survives workspace wipes. install.sh needs a checkout
              # (it reuses an existing one), so check the requested
              # branch out of the mirror first; the scm: checkout runs
              # afterwards and updates the same directory.
              VENV="{daf_venv_dir}"
              REPO="$WORKSPACE/${daf_repo_dir}"
              if [ ! -d "${VENV}" ]; then
                case "${daf_repo_dir}" in
                  ""|.|..|/*)
                    echo "daf_repo_dir must be a relative sub-directory" >&2
                    exit 1
                    ;;
                esac
                rm -rf "${REPO}"
                git clone --depth 1 --branch "${daf_branch}" \
                  "file://{git_mirror_dir}/{daf_mirror_name}.git" "${REPO}"
                cd "${REPO}"
                bash ./install.sh
                mv .env "${VENV}"
                # The fresh venv recorded ${REPO}/.env as its own path;
                # rewrite that so it keeps working from its new home.
                grep -rlI -- "${REPO}/.env" "${VENV}" \
                  | xargs -r sed -i "s|${REPO}/.env|${VENV}|g"
              fi
              # The checkout always uses the shared venv.
              ln -sfn "${VENV}" "${REPO}/.env"

              # Create a directory to store pyang bindings
              mkdir -p ~/yang/
              ln -sfn ~/yang "${REPO}/yang"

  builders:
    # The virtual env lives next to the mirror ({daf_venv_dir}) and is
    # created by install.sh in the pre-SCM step; the checkout only gets
    # a .env symlink to it, so every job uses the same environment while
    # the sources come from this checkout.
    - shell: |
        set -ex
        cd "$WORKSPACE/${daf_repo_dir}"
        if [ -e .env ] && [ ! -L .env ]; then
          rm -rf .env
        fi
        ln -sfn "{daf_venv_dir}" .env
        echo; echo

    # Prepare the build env. 
    # - Checks image and imports it into docker
    # - Extracts version info from docker image
    # - Inject needed env vars. 
    - shell: |
        #!/bin/bash
        echo -e "\nLaunching Testbed and Running Tests"
        source "{daf_venv_dir}/bin/activate" || { echo "Failed to activate the virtual env"; exit; }
        echo "Activated venv {daf_venv_dir}"

        if [ -z "${tb_name}" ]; then
          tb_name="TB${BUILD_NUMBER}"
        fi

        if [[ "$image" =~ .xz$ ]]; then
          # Image is a compressed archive. Check if it exists locally
          [ -f "$image" ] || { echo "Image: '${image}' not found"; exit; }

          docker_image="$(echo $(basename ${image%%.docker.xz}) | sed 's/arcos-/arcos:/')"
          docker image ls "${docker_image}" | grep -q "${docker_image}" || {
            echo -e '\033[32mImporting image into docker\033[0m'
            docker load -i "${image}" || { echo "Docker import of image: '${image}' failed"; exit; }
          }

          image="${docker_image}"
          echo
        fi

        # Check if image is avalable in docker
        docker image ls "${image}" | grep -q "${image}" || { echo "Imported image: '$image' not found in docker. Probably image import had failed"; exit; }

        # Extract version info from the docker image
        version="$(docker run --rm --entrypoint cat ${image} /usr/share/arcos/build_info_cfg.json | grep -Po '"Version": "\K[^:]*')"

        # Write env vars to properties file that later gets injected using
        # the EnvInject plugin, in the step after this.
        #
        # The testbed name is exported as DAF_TB_NAME, not TB_NAME:
        # Jenkins' EnvVars is case-insensitive, so an injected TB_NAME
        # collides with the tb_name build parameter, the (usually empty)
        # parameter value wins and TB_NAME stays unset in the shell.
        # Also do not quote the values: java.util.Properties keeps the
        # quotes as part of the value.
        ENV_FILE="${WORKSPACE}/.daf-env.properties"
        {
          printf 'DAF_TB_NAME=%s\n' "${tb_name}"
          printf 'DAF_IMAGE=%s\n' "${image:-}"
          printf 'VERSION=%s\n' "${version:-}"
          printf 'BUILD_NAME=%s\n' "${version} - ${JOB_NAME}"
        } > "${ENV_FILE}"

    # Inject the variables written by the pytest step into the build
    # environment. Unlike a shell export, these are visible to the later
    # build steps and to the publishers (e.g. the Slack custom message).
    # Requires the EnvInject plugin.
    - inject:
        properties-file: .daf-env.properties

    # Update build name
    - build-name-setter:
        macro: true
        template: '#${BUILD_ID} - ${BUILD_NAME}'

    # Run the pytest script: the one given via the 'script' build
    # parameter, or the default daf/tests/<job name>/run_tests.py.
    - shell: |
        #!/bin/bash
        echo -e "\nLaunching Testbed and Running Tests"
        source "{daf_venv_dir}/bin/activate" || { echo "Failed to activate the virtual env"; exit; }
        echo "Activated venv {daf_venv_dir}"

        #set -ex
        cd "$WORKSPACE/${daf_repo_dir}"
        echo "PWD: $PWD"

        PYTEST_ARGS="${PYTEST_ARGS} --tb-name ${DAF_TB_NAME} --image $DAF_IMAGE"
        if [ -n "${script}" ]; then
          TEST_SCRIPT="${script}"
        else
          TEST_SCRIPT="daf/tests/{name}/run_tests.py"
        fi
        if [ -n "${topo_file}" ]; then
          PYTEST_ARGS="${PYTEST_ARGS} --topo-file ${topo_file}"
        fi
        if [ -n "${yang_branch}" ]; then
          PYTEST_ARGS="${PYTEST_ARGS} --yang-branch ${yang_branch}"
        fi
        if [ "${vpp}" = "true" ]; then
          PYTEST_ARGS="${PYTEST_ARGS} --vpp"
        fi
        if [ "${debug_console}" = "true" ]; then
          PYTEST_ARGS="${PYTEST_ARGS} --debug-console"
        fi
        if [ "${reconnect}" = "true" ]; then
          PYTEST_ARGS="${PYTEST_ARGS} --reconnect"
        fi
        if [ -n "${install_pkgs}" ]; then
          PYTEST_ARGS="${PYTEST_ARGS} --install-pkgs ${install_pkgs}"
        fi

        PYTEST_ARGS="${PYTEST_ARGS} --skip-cleanup --log-dir=${WORKSPACE}/logs/${DAF_TB_NAME} ${extra_args} --junit-xml=${WORKSPACE}/logs/${DAF_TB_NAME}/junit.xml --alluredir=${WORKSPACE}/allure"
        echo "Running -- python3 ${TEST_SCRIPT} ${PYTEST_ARGS}"
        rm -f "${WORKSPACE}/.daf-pytest.rc"
        set +e
        python3 "${TEST_SCRIPT}" ${PYTEST_ARGS}
        PYTEST_RC=$?
        echo "pytest exit code: ${PYTEST_RC}"
        echo; echo
        exit 0

    # Pause before the cleanup step if pytest failed and pause_on_fail
    # is set, so the testbed can be inspected before it is destroyed.
    - shell: |
        #!/bin/bash
        source "{daf_venv_dir}/bin/activate" || { echo "Failed to activate the virtual env"; exit; }
        echo "Activated venv {daf_venv_dir}"

        if [ "${pause_on_fail}" != "true" ]; then
          exit 0
        fi
        PYTEST_RC="$(cat "${WORKSPACE}/.daf-pytest.rc" 2>/dev/null || echo 0)"
        if [ "${PYTEST_RC}" = "0" ]; then
          echo "pytest passed, no pause needed"
          exit 0
        fi

        # The resume marker lives outside the workspace (next to the
        # git mirrors) so it is easy to find and survives workspace
        # cleanup; BUILD_TAG makes it unique per job and build.
        PAUSE_DIR="{git_mirror_dir}/.pause"
        RESUME_FILE="${PAUSE_DIR}/${BUILD_TAG}.resume"
        TIMEOUT=$((3 * 60 * 60))
        mkdir -p "${PAUSE_DIR}"
        rm -f "${RESUME_FILE}"

        echo "pytest failed (exit code ${PYTEST_RC}); pausing before cleanup."
        echo "Inspect the testbed, then resume this build by running:"
        echo "  touch ${RESUME_FILE}"
        echo "Continuing automatically after ${TIMEOUT} seconds otherwise."
        START="$(date +%s)"
        while [ ! -e "${RESUME_FILE}" ]; do
          NOW="$(date +%s)"
          ELAPSED=$((NOW - START))
          if [ "${ELAPSED}" -ge "${TIMEOUT}" ]; then
            echo "Pause timed out after ${ELAPSED} seconds, continuing."
            break
          fi
          echo "Paused (${ELAPSED}/${TIMEOUT}s), waiting for ${RESUME_FILE}"
          sleep 30
        done
        rm -f "${RESUME_FILE}"
        echo "Resuming, running cleanup."

    # Cleanup
    - shell: |
        #!/bin/bash
        source "{daf_venv_dir}/bin/activate" || { echo "Failed to activate the virtual env"; exit; }
        echo "Activated venv {daf_venv_dir}"

        # DAF_TB_NAME / DAF_IMAGE come from the EnvInject step that
        # follows the prepare (image/version) builder.
        DAF_TB_NAME="${DAF_TB_NAME:-TB${BUILD_NUMBER}}"

        if [ ! -d "${WORKSPACE}/logs/${DAF_TB_NAME}" ]; then
          echo "DAF Log dir ${WORKSPACE}/logs/${DAF_TB_NAME} doesn't exist"
          echo "Previous launch might have failed before deployment" 
          echo "Nothing to clean/ Exiting"
          exit
        fi

        echo -e "\nCleaning up Testbed: ${DAF_TB_NAME}"

        #set -ex
        cd "$WORKSPACE/${daf_repo_dir}"
        echo "PWD: $PWD"

        echo "daf destroy --tb-name "${DAF_TB_NAME}" --topo-file "${topo_file}" --log-dir=${WORKSPACE}/logs/${DAF_TB_NAME}"
        daf destroy --tb-name "${DAF_TB_NAME}" --topo-file "${topo_file}" --log-dir=${WORKSPACE}/logs/${DAF_TB_NAME}

    # Re-raise the deferred pytest failure (see the pytest builder) after
    # the cleanup step ran, so the build result reflects the test run.
    - shell: |
        #!/bin/bash
        RC_FILE="${WORKSPACE}/.daf-pytest.rc"
        if [ ! -f "${RC_FILE}" ]; then
          exit 0
        fi
        PYTEST_RC="$(cat "${RC_FILE}")"
        rm -f "${RC_FILE}"
        echo "pytest exit code was ${PYTEST_RC}"
        exit "${PYTEST_RC}"

  publishers:
    # Send the email report to the configured recipients.
    # To suspend email temporarily, comment out this email publisher,
    # push (./manage_jobs.sh push) and uncomment + push again to resume;
    # a push without it removes the publisher from the Jenkins job.
    - email:
        recipients: "{report_email}"

    # Publish the JUnit results written by pytest (--junit-xml) so the
    # test results show up in the build and feed the Slack notifications.
    - junit:
        results: logs/${DAF_TB_NAME}/junit.xml
        keep-long-stdio: true

    # Send Slack notifications to the daf-jenkins channel, using the
    # bot token credential stored in Jenkins.
    - slack:
        room: daf-jenkins
        bot-user: true
        auth-token-credential-id: daf-slack-token
        notify-start: false
        notify-success: true
        notify-aborted: true
        notify-not-built: false
        notify-unstable: true
        notify-failure: true
        notify-back-to-normal: true
        notify-regression: true
        notify-repeated-failure: true

        include-test-summary: true
        include-failed-tests: true

        include-custom-message: true
        custom-message: "IMAGE: ${DAF_IMAGE}: VERSION: ${VERSION} Full Report: <${BUILD_URL}allure>"

    # Publish the allure report for the build. pytest writes the allure
    # results to ${WORKSPACE}/allure (see --alluredir in the pytest
    # builder); the old <daf-repo>/daf/allure-results location is still
    # supported.
    - allure:
        results-paths:
          - path: "allure"
          - path: "${daf_repo_dir}/daf/allure-results"
        report-build-policy: ALWAYS

    # Archive the build artifacts (pytest logs, junit xml and allure
    # results, all under the workspace root).
    - archive:
        artifacts: "**/*.xml, **/*.log, allure/**, ${daf_repo_dir}/daf/allure-results/**"
        allow-empty: true

# ------------------------------ DAF Pipeline ---------------------------------
# Pipeline job that runs every DAF test job defined in jobs.yaml in
# sequence, then aggregates the results of all of them into a
# consolidated report (overview.html / summary.txt archived next to the
# copied results of each job), and emails a summary.
#
# The list of jobs to run ({daf_jobs}) and the default report recipients
# ({report_email}) are filled in by generate_job_definitions.py; add new
# jobs to jobs.yaml and they automatically become part of the pipeline.
daf_pipeline_job:
  name: DAF Pipeline
  description: |
    Runs all DAF test jobs in sequence for the given image, then
    aggregates the results into a consolidated report
    (consolidated-report/overview.html + summary.txt) and emails a
    summary to the recipients parameter.

    Generated by generate_job_definitions.py - do not edit by hand.

  # Allow the pipeline to be triggered remotely, e.g.:
  #   curl -X POST "https://<jenkins>/job/DAF%20Pipeline/buildWithParameters?token=daf-pipeline-remote-trigger&image=<image name>"
  auth-token: daf-pipeline-remote-trigger

  logrotate:
    numToKeep: 30

  parameters:
    - validating-string:
        name: image
        regex: ".+"
        msg: "image parameter is mandatory"
        description: >
          Image name to run the DAF jobs against (mandatory); passed
          down to every DAF test job.
    - string:
        name: extra_args
        default: ""
        description: >
          Extra arguments to append to the pytest command line of
          every DAF test job (e.g. "-k smoke -x"). Inherited by (passed
          down to) all the DAF test jobs.
    - string:
        name: topo_file
        default: ""
        description: >
          Topology file for the DAF test jobs (passed to pytest as
          --topo-file). If non-empty, overrides the topo_file parameter
          of every DAF test job; if empty, each job uses its own
          default.
    - bool:
        name: vpp
        default: False
        description: >
          When checked, adds --vpp to the pytest command line of every
          DAF test job (inherited / passed down to all of them).
    - bool:
        name: debug_console
        default: False
        description: >
          When checked, adds --debug-console to the pytest command line
          of every DAF test job (inherited / passed down to all of them).
    - bool:
        name: reconnect
        default: False
        description: >
          When checked, adds --reconnect to the pytest command line of
          every DAF test job (inherited / passed down to all of them).
    - string:
        name: install_pkgs
        default: ""
        description: >
          Packages to install, passed to pytest as --install-pkgs. If
          non-empty, inherited by (passed down to) every DAF test job;
          if empty, no --install-pkgs argument is added.
    - bool:
        name: pause_on_fail
        default: False
        description: >
          When checked, a DAF test job whose pytest run failed pauses
          before its cleanup step (up to 3 hours) so the testbed can be
          inspected; resume it by creating the .resume file named in the
          build's console output. Passed down to all DAF test jobs.
    - string:
        name: tb_name
        default: ""
        description: >
          Testbed name for the DAF test jobs (passed to pytest as
          --tb-name). If non-empty, overrides the tb_name parameter of
          every DAF test job; if empty, each job defaults to
          TB<BUILD_NUMBER>.
    - string:
        name: daf_branch
        default: ""
        description: >
          If non-empty, overrides the daf_branch parameter of every DAF
          test job. If empty, each job uses its own default branch.
    - string:
        name: yang_branch
        default: ""
        description: >
          If non-empty, overrides the yang_branch parameter of every DAF
          test job (pytest --yang-branch). If empty, each job uses its
          own default.
    - string:
        name: recipients
        default: "{report_email}"
        description: >
          Comma-separated recipients of the consolidated report email.
    - string:
        name: label
        default: ""
        description: >
          Node label expression that restricts where the pipeline and
          all its DAF test jobs can run. If left empty, no restriction
          (any node).

  project-type: pipeline
  dsl: |
    def dafJobs = {daf_jobs}

    node("${params.label}") {
        stage("Run DAF jobs") {
            def results = [:]
            for (jobName in dafJobs) {
                echo "Running DAF job: " + jobName
                def overrides = []
                overrides << [$class: "StringParameterValue", name: "image", value: params.image]
                overrides << [$class: "StringParameterValue", name: "extra_args", value: (params.extra_args ?: "")]
                if (params.topo_file?.trim()) {
                    overrides << [$class: "StringParameterValue", name: "topo_file", value: params.topo_file]
                }
                if (params.vpp) {
                    overrides << [$class: "BooleanParameterValue", name: "vpp", value: true]
                }
                if (params.debug_console) {
                    overrides << [$class: "BooleanParameterValue", name: "debug_console", value: true]
                }
                if (params.reconnect) {
                    overrides << [$class: "BooleanParameterValue", name: "reconnect", value: true]
                }
                if (params.install_pkgs?.trim()) {
                    overrides << [$class: "StringParameterValue", name: "install_pkgs", value: params.install_pkgs]
                }
                if (params.pause_on_fail) {
                    overrides << [$class: "BooleanParameterValue", name: "pause_on_fail", value: true]
                }
                if (params.tb_name?.trim()) {
                    overrides << [$class: "StringParameterValue", name: "tb_name", value: params.tb_name]
                }
                if (params.daf_branch?.trim()) {
                    overrides << [$class: "StringParameterValue", name: "daf_branch", value: params.daf_branch]
                }
                if (params.yang_branch?.trim()) {
                    overrides << [$class: "StringParameterValue", name: "yang_branch", value: params.yang_branch]
                }

                def run = build job: jobName, propagate: false, wait: true, parameters: overrides
                results[jobName] = [result: run.result, build: run.number, url: run.absoluteUrl, duration: run.durationString]
            }

            def overall = "SUCCESS"
            dafJobs.each { jobName ->
                def r = results[jobName]
                if (r.result == "FAILURE") {
                    overall = "FAILURE"
                } else if (r.result == "UNSTABLE" && overall == "SUCCESS") {
                    overall = "UNSTABLE"
                }
            }

            def summary = "DAF Pipeline - image: " + params.image + "  (overall: " + overall + ")\n"
            def rows = ""
            dafJobs.each { jobName ->
                def r = results[jobName]
                summary = summary + "  " + jobName + " #" + r.build + ": " + r.result + " (" + r.duration + ") - " + r.url + "\n"
                rows = rows + "<tr><td>" + jobName + "</td><td>" + r.result + "</td><td>" + r.duration + "</td><td><a href=\"" + r.url + "\">build #" + r.build + "</a></td></tr>\n"
            }

            stage("Aggregate results") {
                sh "mkdir -p consolidated-results"
                dafJobs.each { jobName ->
                    def dest = "consolidated-results/" + jobName
                    sh "mkdir -p '" + dest + "'"
                    def sel = specific(results[jobName].build as int)
                    try {
                        copyArtifacts(projectName: jobName, selector: sel, targetPath: dest, filter: "**/*.xml")
                    } catch (err) {
                        echo "no xml artifacts from " + jobName
                    }
                    try {
                        copyArtifacts(projectName: jobName, selector: sel, targetPath: dest, filter: "**/allure/**, **/allure-results/**")
                    } catch (err) {
                        echo "no allure results from " + jobName
                    }
                }

                def html = "<html><head><title>DAF consolidated report</title></head><body><h1>DAF consolidated report</h1><p>image: " + params.image + "</p><p>overall: " + overall + "</p><table border=\"1\"><tr><th>job</th><th>result</th><th>duration</th><th>build</th></tr>" + rows + "</table></body></html>"
                sh "mkdir -p consolidated-report"
                writeFile file: "consolidated-report/overview.html", text: html
                writeFile file: "consolidated-report/summary.txt", text: summary
                archiveArtifacts artifacts: "consolidated-report/**, consolidated-results/**", allowEmptyArchive: true
            }

            echo summary
            mail to: params.recipients,
                 subject: "DAF consolidated report - image: " + params.image + " - " + overall,
                 body: summary
        }
    }
