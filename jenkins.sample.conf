# Sample configuration file for jenkins-job-builder (JJJ/JJB).
#
# Copy this file to jenkins.conf and fill in the actual values for your
# Jenkins server:
#
#     cp jenkins.sample.conf jenkins.conf
#
# The format is a standard Microsoft Windows INI style configuration file
# with two mandatory sections: [job_builder] and [jenkins].
#
# DO NOT commit jenkins.conf (with real credentials) to source control.

[job_builder]
# Allow job variables in YAML templates to be empty instead of failing.
allow_empty_variables = True

# Patterns to include when reading job definitions from directories.
include_path = **/*.yaml

# Read job definitions recursively from sub-directories.
recursive = True

# Keep the job description even if it is empty in the YAML definition.
keep_descriptions = True

# Do not attempt to update descriptions of existing jobs.
no_syntaxes = False

[jenkins]
# URL of the Jenkins server to push / update / delete jobs on.
url = https://jenkins.example.com

# Jenkins user name (an account with permission to create and update jobs).
user = admin

# Password or API token for the user above.
# (Recommended: create an API token from
#  Jenkins -> User -> Configure -> API Token and use it here.)
password = 0123456789abcdef0123456789abcdef

# OPTIONAL settings (uncomment to change from the defaults):
#
# Query the Jenkins server for plugin information prior to submitting
# jobs (makes JJB aware of newer plugin features).
# query_plugins_info = False
#
# Connection timeout in seconds for the Jenkins REST API.
# timeout = 30
#
# Only operate on jobs whose names match this pattern.
# jobs = daf-*
